[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trialtrace"
version = "0.1.0"
requires-python = ">=3.12"
# Only what the code uses today. Each lesson adds its own libraries.
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.11,<3",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "openai>=2.0,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dashboard = ["streamlit>=1.51,<2", "Authlib>=1.3.2"]      # Authlib is needed by st.login
dev = ["pytest>=9", "fastapi>=0.115,<1"]        # the API tests need fastapi

[tool.setuptools.packages.find]
include = ["trialtrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
