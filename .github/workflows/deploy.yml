# Deploys the dashboard to Cloud Run after CI passes on main.
# Signs in to Google with Workload Identity Federation (no key file stored in GitHub).
# Only the image changes: the secrets, database link and settings on the service stay as they are.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: trialtrace-514821
  REGION: us-central1
  SERVICE: trialtrace-dashboard
  IMAGE: us-central1-docker.pkg.dev/trialtrace-514821/trialtrace/dashboard

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1061960202985/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@trialtrace-514821.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push the image
        run: |
          TAG=${{ github.event.workflow_run.head_sha || github.sha }}
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update "$SERVICE" --region "$REGION" --image "$IMAGE:$TAG"

      - name: Check the site answers
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          curl -fsS "$URL/_stcore/health"
